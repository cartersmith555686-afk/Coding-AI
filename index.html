<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Fable 5.1</title>
    <style>
        :root {
            --bg-app: #191919; --bg-card: #222222; --bg-input: #2a2a2a;
            --text-main: #e6e4df; --text-muted: #b5b3ad; --accent: #e0b883;
            --accent-red: #ff6b6b; --accent-green: #51cf66; --border: #333333;
        }
        body { margin: 0; background-color: var(--bg-app); color: var(--text-main); font-family: sans-serif; height: 100vh; display: flex; justify-content: center; }
        .claude-app { width: 100%; max-width: 800px; height: 100vh; display: flex; flex-direction: column; }
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); }
        .icon-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 6px 14px; border-radius: 20px; cursor: pointer; }
        .config-panel { background: var(--bg-card); border-bottom: 2px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .hidden { display: none; }
        textarea { width: 100%; background: var(--bg-app); color: #e6e4df; border: 1px solid var(--border); border-radius: 8px; padding: 10px; box-sizing: border-box; }
        #system-prompt { height: 60px; color: #93c5fd; }
        #training-data { height: 80px; color: #a7f3d0; font-family: monospace; }
        .action-btn { background: var(--accent); color: #111; font-weight: bold; border: none; padding: 12px; border-radius: 8px; cursor: pointer; }
        .slider-container { background: var(--bg-app); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
        .slider-header { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .msg { display: flex; flex-direction: column; max-width: 85%; }
        .msg.system { align-self: center; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
        .msg.user { align-self: flex-end; }
        .msg.ai { align-self: flex-start; width: 100%; }
        .msg-content { padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 0.95rem; }
        .user .msg-content { background-color: var(--bg-input); border: 1px solid var(--border); }
        .ai .msg-content { font-family: monospace; white-space: pre-wrap; }
        .input-container { padding: 15px 20px; }
        .input-wrapper { display: flex; align-items: center; background-color: var(--bg-input); border: 1px solid var(--border); border-radius: 28px; padding: 6px 16px; gap: 12px; }
        #chat-input { flex: 1; background: transparent; border: none; height: 24px; color: var(--text-main); font-size: 1rem; outline: none; resize: none; }
        .send-btn { background-color: var(--accent); color: #111; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge.unrestricted { color: var(--accent-red); }
        .badge.balanced { color: var(--accent); }
        .badge.strict { color: var(--accent-green); }
    </style>
</head>
<body>
    <div class="claude-app">
        <header class="app-header">
            <div class="brand"><span style="color:var(--accent)">✦</span> Claude Fable 5.1</div>
            <button id="toggle-config-btn" class="icon-btn">⚙️ Custom AI Settings</button>
        </header>

        <section id="config-panel" class="config-panel hidden">
            <h3>1. System Persona Prompt</h3>
            <textarea id="system-prompt" placeholder="Set model persona instructions..."></textarea>
            <h3>2. Context Training Dataset</h3>
            <textarea id="training-data" placeholder="Paste python/js scripts here..."></textarea>
            <button id="train-btn" class="action-btn">Compile Cloud Weights</button>
            <div id="status-box" style="font-size:0.8rem; font-family:monospace; margin-top:5px; color:var(--text-muted)">Status: Awaiting engine setup...</div>
            
            <div class="slider-container" style="margin-top:10px;">
                <div class="slider-header"><span>Strictness:</span><span id="strictness-val" class="badge balanced">Balanced</span></div>
                <input type="range" id="strictness-slider" min="0" max="100" value="50" style="width:100%">
            </div>
        </section>

        <main class="chat-container" id="chat-container">
            <div class="msg system"><div class="msg-content">Open settings above, adjust your instructions, and hit <strong>Compile</strong> to spin up your cloud-hosted backend.</div></div>
        </main>

        <footer class="input-container">
            <div class="input-wrapper">
                <textarea id="chat-input" placeholder="Please train the system persona first..." disabled></textarea>
                <button id="generate-btn" class="send-btn" disabled>→</button>
            </div>
        </footer>
    </div>

    <script>
        const toggleConfigBtn = document.getElementById('toggle-config-btn');
        const configPanel = document.getElementById('config-panel');
        const strictnessSlider = document.getElementById('strictness-slider');
        const strictnessVal = document.getElementById('strictness-val');
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const generateBtn = document.getElementById('generate-btn');
        const trainBtn = document.getElementById('train-btn');

        toggleConfigBtn.addEventListener('click', () => configPanel.classList.toggle('hidden'));
        
        strictnessSlider.addEventListener('input', () => {
            const val = strictnessSlider.value;
            if(val < 35) { strictnessVal.textContent = "Unrestricted"; strictnessVal.className = "badge unrestricted"; }
            else if(val <= 70) { strictnessVal.textContent = "Balanced"; strictnessVal.className = "badge balanced"; }
            else { strictnessVal.textContent = "Max Strict"; strictnessVal.className = "badge strict"; }
        });

        function appendMessage(text, side) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg', side);
            msgDiv.innerHTML = `<div class="msg-content">${text}</div>`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        trainBtn.addEventListener('click', async () => {
            document.getElementById('status-box').textContent = "Compiling server memory blocks...";
            const res = await fetch('/train', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    system_prompt: document.getElementById('system-prompt').value,
                    dataset_text: document.getElementById('training-data').value
                })
            });
            const data = await res.json();
            if(data.status === "success") {
                document.getElementById('status-box').textContent = "Server pathways synchronized.";
                chatInput.disabled = false; generateBtn.disabled = false;
                chatInput.placeholder = "Message Claude Fable 5.1...";
                configPanel.classList.add('hidden');
                appendMessage("<em>System initialized. Your cloud-hosted AI instance is active.</em>", "system");
            }
        });

        async function sendMessage() {
            const prompt = chatInput.value.trim();
            if(!prompt) return;
            appendMessage(prompt, "user");
            chatInput.value = "";

            const res = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt: prompt, strictness: strictnessSlider.value })
            });
            const data = await res.json();
            appendMessage(data.output, "ai");
        }

        generateBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    </script>
</body>
</html>
